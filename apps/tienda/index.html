/* ============================================================
   MAIN APP
   ============================================================ */
function App(){
  const [theme,setTheme]=React.useState(()=>localStorage.getItem('rf-theme')||'light');
  React.useEffect(()=>{document.body.classList.toggle('dark-mode',theme==='dark');localStorage.setItem('rf-theme',theme)},[theme]);
  const toggleTheme=()=>setTheme(t=>t==='dark'?'light':'dark');

  const [view,setView]=React.useState('store');
  const [showLogin,setShowLogin]=React.useState(false);
  const [showCart,setShowCart]=React.useState(false);
  const [showCheckout,setShowCheckout]=React.useState(false);
  const [detailProduct,setDetailProduct]=React.useState(null);
  const [adminUser,setAdminUser]=React.useState(null);
  const [products,setProducts]=React.useState([]);
  const [orders,setOrders]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [activeCategory,setActiveCategory]=React.useState('all');
  const [activeSection,setActiveSection]=React.useState('all');
  const [search,setSearch]=React.useState('');
  const [searchInput,setSearchInput]=React.useState('');
  const [promoFilter,setPromoFilter]=React.useState(false);
  const [cart,setCart]=React.useState(()=>{try{return JSON.parse(localStorage.getItem('rf-cart'))||[]}catch{return[]}});
  const [notifs,setNotifs]=React.useState([]);
  const realtimeRef=React.useRef(null);

  React.useEffect(()=>{try{localStorage.setItem('rf-cart',JSON.stringify(cart))}catch{}},[cart]);

  React.useEffect(()=>{
    const t=setTimeout(()=>setSearch(searchInput),280);
    return()=>clearTimeout(t);
  },[searchInput]);

  const fetchProducts=React.useCallback(async(forAdmin=false)=>{
    setLoading(true);
    const table = forAdmin ? 'products' : 'products_public';
    const{data,error}=await supabase.from(table).select('*').order('created_at',{ascending:false});
    if(!error&&data)setProducts(data);
    setLoading(false);
  },[]);

  const fetchOrders=React.useCallback(async()=>{
    const{data,error}=await supabase.from('orders').select('*').order('created_at',{ascending:false});
    if(!error&&data)setOrders(data);
  },[]);

  React.useEffect(()=>{fetchProducts(false)},[fetchProducts]);
  React.useEffect(()=>{initCanvas()},[]);
  React.useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{if(session){setAdminUser(session.user);fetchProducts(true);}});
  },[]);
  React.useEffect(()=>{if(adminUser)fetchOrders()},[adminUser,fetchOrders]);

  React.useEffect(()=>{
    if(!adminUser)return;
    const ch=supabase.channel('orders-realtime')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},(payload)=>{
        const newOrder=payload.new;
        setOrders(prev=>[newOrder,...prev]);
        const nid=Date.now();
        setNotifs(prev=>[...prev,{...newOrder,id:nid,exit:false}]);
        setTimeout(()=>setNotifs(prev=>prev.map(n=>n.id===nid?{...n,exit:true}:n)),6000);
        setTimeout(()=>setNotifs(prev=>prev.filter(n=>n.id!==nid)),6400);
      })
      .subscribe();
    realtimeRef.current=ch;
    return()=>{supabase.removeChannel(ch)};
  },[adminUser]);

  const addToCart=(product)=>setCart(c=>{const ex=c.find(i=>i.product.id===product.id);if(ex)return c.map(i=>i.product.id===product.id?{...i,qty:Math.min(i.qty+1,product.stock)}:i);return[...c,{product,qty:1}]});
  const changeQty=(id,qty)=>{if(qty<=0){setCart(c=>c.filter(i=>i.product.id!==id));return}setCart(c=>c.map(i=>i.product.id===id?{...i,qty}:i))};
  const removeFromCart=(id)=>setCart(c=>c.filter(i=>i.product.id!==id));
  const clearCart=()=>setCart([]);
  const cartCount=cart.reduce((s,i)=>s+i.qty,0);
  const getCartQty=(pid)=>{const item=cart.find(i=>i.product.id===pid);return item?item.qty:0};
  const handleOrderSuccess=(newOrder)=>{setOrders(o=>[newOrder,...o]);clearCart()};
  const handleLogin=(user)=>{setAdminUser(user);setShowLogin(false);setView('admin');fetchProducts(true)};
  const handleLogout=async()=>{await supabase.auth.signOut();setAdminUser(null);setView('store');fetchProducts(false)};
  const goToSection=(sid)=>{setView('store');setActiveSection(sid);setActiveCategory('all');setTimeout(()=>document.getElementById('productos')?.scrollIntoView({behavior:'smooth'}),50)};

  const visibleCats=React.useMemo(()=>{
    if(activeSection==='all')return CATEGORIES;
    const allowed=SECTION_CATS[activeSection];
    return[{id:'all',name:'Todos',icon:'⚡'},...CATEGORIES.filter(c=>c.id!=='all'&&allowed.includes(c.id))];
  },[activeSection]);

  const filtered=products.filter(p=>{
    const sc=SECTION_CATS[activeSection];
    const mS=!sc||sc.includes(p.category);
    const mC=activeCategory==='all'||p.category===activeCategory;
    const mQ=!search||p.name.toLowerCase().includes(search.toLowerCase())||p.description?.toLowerCase().includes(search.toLowerCase());
    const mP=!promoFilter||(p.on_promo&&p.promo_price&&p.promo_price<p.price);
    return mS&&mC&&mQ&&mP;
  });

  const promoCount=products.filter(p=>p.on_promo&&p.promo_price).length;

  if(view==='admin'&&adminUser)return(
    <>
      <nav className="nav">
        <div className="nav-logo" onClick={()=>setView('store')}><span className="logo-pieces"><i>B</i><i>O</i><i>T</i><i>S</i></span><span className="logo-name">ToboTech<span className="logo-sub">por Fractal-Bots</span></span></div>
        <div className="nav-links"><button className="nav-link" onClick={()=>setView('store')}>← Tienda</button></div>
        <div className="nav-right"><ThemeToggle theme={theme} onToggle={toggleTheme}/></div>
      </nav>
      <NotifContainer notifs={notifs} onDismiss={id=>{setNotifs(prev=>prev.map(n=>n.id===id?{...n,exit:true}:n));setTimeout(()=>setNotifs(prev=>prev.filter(n=>n.id!==id)),350)}}/>
      <AdminPanel user={adminUser} products={products} orders={orders} onLogout={handleLogout} onRefresh={()=>fetchProducts(true)}/>
    </>
  );

  return(
    <>
      <nav className="nav">
        <div className="nav-logo" onClick={()=>setView('store')}><span className="logo-pieces"><i>B</i><i>O</i><i>T</i><i>S</i></span><span className="logo-name">ToboTech<span className="logo-sub">por Fractal-Bots</span></span></div>
        <div className="nav-links">
          <button className={`nav-link${view==='store'&&activeSection==='all'?' active':''}`} onClick={()=>{setView('store');setActiveSection('all');setActiveCategory('all')}}>INICIO</button>
          <button className="nav-link services-link" onClick={()=>setView('servicios')}>SERVICIOS</button>
          <button className="nav-link" onClick={()=>goToSection('electronica')} style={{color:activeSection==='electronica'?'var(--cyan)':undefined}}>ELECTRÓNICA</button>
          <button className="nav-link" onClick={()=>goToSection('robotica')} style={{color:activeSection==='robotica'?'var(--cyan)':undefined}}>ROBÓTICA</button>
          <button className="nav-link" onClick={()=>goToSection('computacion')} style={{color:activeSection==='computacion'?'var(--cyan)':undefined}}>COMPUTACIÓN</button>
          <button className="nav-link" onClick={()=>{setView('store');setTimeout(()=>document.getElementById('info')?.scrollIntoView({behavior:'smooth'}),50)}}>ENVÍOS</button>
          <a className="nav-link nav-home" href="https://fractalbotsecua.com">FRACTAL-BOTS&nbsp;↗</a>
        </div>
        <div className="nav-right">
          <ThemeToggle theme={theme} onToggle={toggleTheme}/>
          <button className="cart-btn" onClick={()=>setShowCart(true)}>
            🛒
            {cartCount>0&&<span className="cart-badge">{cartCount}</span>}
            {cartCount>0&&<span className="cart-count-label">{cartCount}</span>}
          </button>
          <button className="btn-login" onClick={()=>setShowLogin(true)}><span className="admin-icon">⬡</span><span className="admin-label"> ADMIN</span></button>
        </div>
      </nav>

      {view==='servicios'&&<ServicesPage onBack={()=>setView('store')}/>}

      {view==='store'&&(
        <>
          {/* HERO */}
          <section className="hero">
            <div className="hero-grid"/>
            <div style={{position:'absolute',right:'5%',top:'20%',opacity:.05,fontSize:'300px',lineHeight:1,pointerEvents:'none',userSelect:'none',color:'var(--cyan)'}}>⬡</div>
            <div style={{position:'absolute',left:'3%',bottom:'15%',opacity:.04,fontSize:'200px',lineHeight:1,pointerEvents:'none',userSelect:'none',color:'var(--cyan)'}}>⬡</div>
            <div className="hero-content">
              <div className="hero-badge"><span className="badge-dot"/>COMPONENTES ELECTRÓNICOS · ROBÓTICA · COMPUTACIÓN</div>
              <h1 className="hero-title">COMPONENTES<br/><span className="glow">PARA CREADORES</span><span className="fractal">ToboTech · Fractal-Bots</span></h1>
              <p className="hero-sub">Raspberry Pi, Arduino, ESP32, sensores, robótica e impresión 3D.<br/>No solo vendemos componentes: <strong>sabemos para qué sirven.</strong></p>
              <div className="hero-cta">
                <button className="btn-primary" onClick={()=>document.getElementById('productos')?.scrollIntoView({behavior:'smooth'})}>EXPLORAR PRODUCTOS</button>
                <button className="btn-services" onClick={()=>setView('servicios')}>VER SERVICIOS</button>
                <button className="btn-secondary" onClick={()=>document.getElementById('info')?.scrollIntoView({behavior:'smooth'})}>ENVÍOS & PAGOS</button>
              </div>
            </div>
          </section>

          {/* STATS */}
          <div className="stats-bar">
            <div className="stat-item"><span className="stat-num">+500</span><span className="stat-label">Componentes</span></div>
            <div className="stat-item"><span className="stat-num">3</span><span className="stat-label">Servicios</span></div>
            <div className="stat-item"><span className="stat-num">24hs</span><span className="stat-label">Impresión 3D</span></div>
            <div className="stat-item"><span className="stat-num">100%</span><span className="stat-label">Ecuador</span></div>
          </div>

          {/* PRODUCTS */}
          <section id="productos" className="section">
            <div className="section-header">
              <span className="section-tag">Catálogo completo</span>
              <h2 className="section-title">
                {activeSection==='all'?<>NUESTROS <em>PRODUCTOS</em></>:activeSection==='electronica'?<>COMPONENTES <em>ELECTRÓNICOS</em></>:activeSection==='robotica'?<>ROBÓTICA <em>& EDUCACIÓN</em></>:<>COMPUTACIÓN <em>& CELULARES</em></>}
              </h2>
            </div>

            <div style={{display:'flex',gap:7,marginBottom:20,flexWrap:'wrap'}}>
              {SECTIONS.map(s=>(
                <button key={s.id} onClick={()=>{setActiveSection(s.id);setActiveCategory('all')}} style={{padding:'7px 16px',fontFamily:'JetBrains Mono,monospace',fontSize:'.72rem',letterSpacing:'.1em',cursor:'pointer',transition:'.3s',border:'1px solid',background:activeSection===s.id?'var(--cyan)':'var(--glass)',borderColor:activeSection===s.id?'var(--cyan)':'var(--glass-border)',color:activeSection===s.id?'#fff':'var(--muted)',fontWeight:activeSection===s.id?700:400,clipPath:'polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))'}}>
                  {s.label}
                </button>
              ))}
            </div>

            <div style={{display:'flex',gap:12,alignItems:'flex-start',flexWrap:'wrap',marginBottom:8}}>
              <div className="search-wrap">
                <input placeholder="🔍  Buscar productos..." value={searchInput} onChange={e=>setSearchInput(e.target.value)}/>
                {searchInput?<button className="search-clear" onClick={()=>{setSearchInput('');setSearch('')}}>✕</button>:<span className="search-icon"/>}
              </div>
              <div className="filter-pills">
                {promoCount>0&&(
                  <button className={`filter-pill${promoFilter?' active':''}`} onClick={()=>setPromoFilter(v=>!v)}>
                    <span className="pill-dot"/>🔥 EN PROMO ({promoCount})
                  </button>
                )}
              </div>
            </div>

            <div className="cat-scroll-wrap">
              <div className="categories-grid">
                {visibleCats.map(cat=>(
                  <div key={cat.id} className={`cat-card${activeCategory===cat.id?' active':''}`} onClick={()=>setActiveCategory(cat.id)}>
                    <span className="cat-icon">{cat.icon}</span>
                    <span className="cat-name">{cat.name}</span>
                  </div>
                ))}
              </div>
            </div>

            {loading
              ?<div className="loader"><div className="loader-dot"/><div className="loader-dot"/><div className="loader-dot"/></div>
              :filtered.length===0
                ?<div style={{textAlign:'center',padding:'60px',color:'var(--muted)',fontFamily:'JetBrains Mono,monospace'}}>
                  {products.length===0?'// CATÁLOGO_VACÍO — El admin está cargando productos':'// NO_RESULTS — Intenta otra búsqueda'}
                </div>
                :<div className="products-grid">
                  {filtered.map(p=><ProductCard key={p.id} product={p} onAddToCart={addToCart} cartQty={getCartQty(p.id)} onDetail={setDetailProduct}/>)}
                </div>
            }
          </section>

          {/* INFO */}
          <section id="info" style={{background:'var(--glass)',borderTop:'1px solid var(--glass-border)',borderBottom:'1px solid var(--glass-border)'}}>
            <div className="section" style={{paddingTop:60,paddingBottom:60}}>
              <div className="section-header">
                <span className="section-tag">Información importante</span>
                <h2 className="section-title">ENVÍOS & <em>FORMAS DE PAGO</em></h2>
              </div>
              <div className="info-grid">
                <div className="info-card"><span className="info-card-icon">🚀</span><div className="info-card-title">ENVÍOS A TODO ECUADOR</div><div className="info-card-text">Despachamos a todo el territorio. Tiempo estimado: <strong>2 a 5 días hábiles</strong>.</div></div>
                <div className="info-card"><span className="info-card-icon">💳</span><div className="info-card-title">FORMAS DE PAGO</div><div className="info-card-text"><span className="tag-pill">🏦 Transferencia</span><span className="tag-pill">💵 Efectivo</span><br/><br/>Datos de cuenta al confirmar por WhatsApp.</div></div>
                <div className="info-card"><span className="info-card-icon">📦</span><div className="info-card-title">¿CÓMO COMPRAR?</div><div className="info-card-text"><strong>1.</strong> Clic en un producto → ver detalle.<br/><strong>2.</strong> Agrega al carrito.<br/><strong>3.</strong> Finaliza por WhatsApp.<br/><strong>4.</strong> Confirmamos stock y enviamos datos.</div></div>
              </div>
            </div>
          </section>

          {/* CONTACT */}
          <section id="contacto" className="section">
            <div className="section-header"><span className="section-tag">Contacto directo</span><h2 className="section-title">HABLEMOS <em>HOY</em></h2></div>
            <div className="info-grid" style={{maxWidth:900}}>
              <div className="info-card" style={{textAlign:'center'}}>
                <span className="info-card-icon">📱</span>
                <div className="info-card-title">WHATSAPP</div>
                <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noreferrer" style={{display:'block',color:'var(--green)',fontSize:'1.15rem',fontWeight:700,textDecoration:'none',marginTop:7}}>+593 990 163 527</a>
              </div>
              <div className="info-card" style={{textAlign:'center'}}>
                <span className="info-card-icon">✉️</span>
                <div className="info-card-title">EMAIL</div>
                <div style={{color:'var(--cyan)',fontSize:'1rem',fontWeight:600,marginTop:7}}>info@fractalbotsecua.com</div>
              </div>

              {/* ── LOGIN CARD ── */}
              <div className="login-contact-card">
                <span className="info-card-icon" style={{display:'block',fontSize:'1.9rem',marginBottom:14}}>⬡</span>
                <div className="info-card-title" style={{fontFamily:'Bricolage Grotesque,sans-serif',fontSize:'.88rem',fontWeight:700,color:'var(--cyan)',marginBottom:9,letterSpacing:'.08em'}}>PANEL ADMIN</div>
                <div className="info-card-text" style={{fontSize:'.88rem',color:'var(--muted)',lineHeight:1.7}}>
                  Acceso exclusivo para administradores de la tienda.
                </div>
                <button className="btn-login-card" onClick={()=>setShowLogin(true)}>
                  <span>⬡</span><span>INGRESAR AL PANEL</span>
                </button>
              </div>
            </div>
          </section>

          <footer>
            <div className="footer-logo">ToboTech · Componentes para creadores</div>
            <div className="footer-text">Electrónica · Robótica · Computación · Impresión 3D · Fabricación PCB · Ecuador</div>
            <div className="footer-eco">
              <a href="https://fractalbotsecua.com">Fractal-Bots</a>
              <span>·</span>
              <a href="https://sistema.fractalbotsecua.com">Plataforma de gestión</a>
              <span>·</span>
              <a href="https://wa.me/593990163527">099 016 3527</a>
            </div>
            <div className="footer-fine">ToboTech es la línea comercial de Fractal-Bots · Quito, Ecuador</div>
          </footer>
        </>
      )}

      {detailProduct&&<ProductDetail product={detailProduct} onClose={()=>setDetailProduct(null)} onAddToCart={addToCart} cartQty={getCartQty(detailProduct.id)}/>}
      {showCart&&<CartPanel cart={cart} onClose={()=>setShowCart(false)} onQtyChange={changeQty} onRemove={removeFromCart} onClearCart={clearCart} onCheckout={()=>{setShowCart(false);setShowCheckout(true)}}/>}
      {showCheckout&&<CheckoutModal cart={cart} onClose={()=>setShowCheckout(false)} onSuccess={handleOrderSuccess}/>}
      {showLogin&&<LoginModal onClose={()=>setShowLogin(false)} onLogin={handleLogin}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
